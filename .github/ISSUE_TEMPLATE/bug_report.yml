name: Bug report
description: Report a reproducible defect in the trading or ML pipeline
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make the project more reliable.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Python version
      placeholder: "3.11.9"
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Data source
      options:
        - Synthetic dry-run data
        - Public exchange data
        - Local fixture
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials and personal data before submitting.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed API keys, credentials, and private account data.
          required: true
        - label: I searched existing issues for this problem.
          required: true

